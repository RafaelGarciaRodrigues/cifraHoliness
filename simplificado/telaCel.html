<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cifras</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
	* { box-sizing: border-box; }
	html, body {
		margin: 0;
		padding: 0;
		background: #1c1c1c;
		color: #f0f0f0;
		font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
	}
	#lista-musicas {
		display: flex;
		flex-direction: column;
		padding: 4px 44px 60px 12px;
	}
	.musica {
		border-bottom: 1px solid #333;
		padding: 18px 0;
	}
	.musica h2 {
		font-size: 1.15em;
		color: #ffcc66;
		margin: 0 0 10px 0;
		cursor: pointer;
		user-select: none;
	}
	.musica.selecionada h2 {
		color: #f60;
	}
	.musica .velocidade-controle {
		display: flex;
		align-items: center;
		gap: 8px;
		margin: 0 0 14px 0;
		font-size: 0.8em;
		color: #999;
	}
	.musica .velocidade-controle input[type="range"] {
		flex: 1;
		accent-color: #4ade80;
	}
	.musica .velocidade-valor {
		min-width: 3.2em;
		text-align: right;
	}
	.musica pre.cifra {
		font-family: "Courier New", Consolas, monospace;
		font-size: 0.95em;
		line-height: 1.45;
		white-space: pre;
		overflow-x: auto;
		margin: 0;
		-webkit-overflow-scrolling: touch;
		color: #fff;
	}
	.musica pre.cifra .chord {
		color: #f60;
	}
	.musica pre.cifra .linha.intro {
		color: #bbb;
	}
	.musica pre.cifra .linha.intro .chord {
		color: #0ff;
	}
	#controles-velocidade {
		position: fixed;
		top: 6px;
		right: 2px;
		display: flex;
		flex-direction: column;
		gap: 8px;
		z-index: 10;
	}
	#nav-alfabeto {
		position: fixed;
		top: 50%;
		right: 2px;
		transform: translateY(-50%);
		display: flex;
		flex-direction: column;
		max-height: 92vh;
		overflow-y: auto;
		background: rgba(16, 16, 16, 0.85);
		border-radius: 10px;
		padding: 4px 2px;
		z-index: 10;
	}
	#nav-alfabeto a {
		display: block;
		text-align: center;
		width: 24px;
		font-size: 11px;
		line-height: 18px;
		text-decoration: none;
	}
	#nav-alfabeto a.ativo {
		color: #ffcc66;
		font-weight: bold;
	}
	#nav-alfabeto a.inativo {
		color: #555;
		pointer-events: none;
	}
	#nav-alfabeto a.atual {
		color: #f60;
	}
	#controles-inferiores {
		position: fixed;
		left: 50%;
		bottom: 16px;
		transform: translateX(-50%);
		display: flex;
		align-items: center;
		gap: 14px;
		z-index: 10;
	}
	.botao-circular {
		width: 52px;
		height: 52px;
		border-radius: 50%;
		background: #101010;
		color: #fff;
		opacity: 0.6;
		display: flex;
		align-items: center;
		justify-content: center;
		font-size: 1.6em;
		border: 1px solid #333;
	}
	.botao-circular:active {
		opacity: 0.9;
	}
	.botao-circular.pequeno {
		width: 40px;
		height: 40px;
		font-size: 1.2em;
	}
	.botao-circular[hidden] {
		display: none;
	}
	#acorde-modal {
		position: fixed;
		inset: 0;
		display: none;
		align-items: center;
		justify-content: center;
		z-index: 20;
	}
	#acorde-modal.aberto {
		display: flex;
	}
	#acorde-modal .caixa {
		background: rgba(16, 16, 16, 0.55);
		color: #fff;
		padding: 22px 32px;
		border-radius: 14px;
		text-align: center;
		border: 1px solid rgba(255, 255, 255, 0.15);
	}
	#acorde-modal .simbolo {
		color: #f60;
		font-weight: bold;
		font-size: 1.5em;
		margin-bottom: 10px;
	}
	#acorde-modal .notas {
		font-size: 1.2em;
		letter-spacing: 1px;
	}
	.botao-circular.copiado {
		opacity: 0.9;
		color: #4ade80;
	}
	#nav-alfabeto a.grupo-toggle {
		color: #ffcc66;
		margin-top: 4px;
		border-top: 1px solid #444;
		padding-top: 6px;
	}
	#grupos-painel {
		position: fixed;
		top: 0;
		left: 0;
		right: 0;
		display: none;
		flex-wrap: wrap;
		gap: 8px;
		padding: 10px 44px 10px 12px;
		background: rgba(16, 16, 16, 0.95);
		border-bottom: 1px solid #333;
		z-index: 15;
	}
	#grupos-painel.visivel {
		display: flex;
	}
	.botao-circular.botao-grupo {
		width: auto;
		height: auto;
		border-radius: 10px;
		padding: 8px 16px;
		font-size: 1em;
		cursor: pointer;
		user-select: none;
	}
	.botao-circular.botao-grupo.ativo {
		color: #f60;
		border-color: #f60;
		opacity: 0.9;
	}

	/* Indicador de diagnostico: mostra se a tela esta sendo mantida acesa (navigator.wakeLock)
	   enquanto o play esta ativo. So existe pra facilitar debug num aparelho sem acesso a
	   ferramentas de desenvolvedor - ver simplificado/spec_esp32.md. */
	#wakelock-indicativo {
		font-size: 0.9em;
		opacity: 1;
	}
	#wakelock-indicativo.ativo {
		color: #4ade80;
	}
	#wakelock-indicativo.falhou {
		color: #f66;
	}
</style>
</head>
<body>
<nav id="nav-alfabeto"></nav>
<div id="grupos-painel"></div>
<div id="controles-velocidade">
	<div id="velocidade-menos-btn" class="botao-circular pequeno" hidden><i class="bi bi-music-note"></i></div>
	<div id="velocidade-mais-btn" class="botao-circular pequeno" hidden><i class="bi bi-music-note-beamed"></i></div>
</div>
<div id="lista-musicas"></div>
<div id="controles-inferiores">
	<div id="download-btn" class="botao-circular pequeno"><i class="bi bi-cloud-download"></i></div>
	<div id="filtro-btn" class="botao-circular pequeno" hidden><i class="bi bi-funnel"></i></div>
	<div id="transpor-mais-btn" class="botao-circular pequeno"><i class="bi bi-plus"></i></div>
	<div id="play-pause-btn" class="botao-circular"><i class="bi bi-play"></i></div>
	<div id="wakelock-indicativo" class="botao-circular pequeno" hidden>●</div>
	<div id="transpor-menos-btn" class="botao-circular pequeno"><i class="bi bi-dash"></i></div>
	<div id="limpar-selecao-btn" class="botao-circular pequeno" hidden><i class="bi bi-x"></i></div>
	<div id="compartilhar-btn" class="botao-circular pequeno" hidden><i class="bi bi-share"></i></div>
</div>
<div id="acorde-modal">
	<div class="caixa">
		<div class="simbolo"></div>
		<div class="notas"></div>
	</div>
</div>

<script>
(function () {
	"use strict";

	// Instantaneo do HTML puro, capturado ANTES de qualquer manipulacao do DOM (nav-alfabeto,
	// lista-musicas, controles-velocidade etc. abaixo comecam vazios e sao preenchidos via
	// appendChild). Usado pelo botao de download - se pegassemos o DOM ao vivo no momento do
	// clique, viria com tudo isso ja duplicado, e ao reabrir o arquivo baixado o mesmo script
	// preencheria de novo por cima, duplicando a cada novo download.
	var htmlOriginal = document.documentElement.outerHTML;

	function normalizar(str) {
		return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();
	}

	// ===== Identifica\u00e7\u00e3o de cifras (recriado de app.html) =====
	// Aceita: D5(9), A9/C#, Em7(9), G5/F#, G7M, A4, Bm7(11), D7M/A, Eb\u00ba, E7(b9), A4(7/9), (6/9) etc.
	var CHORD_TOKEN_RE = (function () {
		var ROOT = "(?:[A-G](?:#|b)?)"; // nota raiz A..G com #/b

		// Sufixos combinaveis (zero ou mais), ex.: m, maj7, 4, 5, 7, 9, 11, 13...
		var SUF = "(?:m|maj7|M7|7M|maj|dim7|dim|\u00ba7|\u00ba|\u00b07|\u00b0|aug|\\+|sus2|sus4|add9|add11|add13|2|4|5|6|7|9|11|13)";

		// Itens aceitos dentro (e fora) de parenteses: inclui 6 e 7, alem de 9/11/13 e alteracoes comuns
		var ALT_UNIT =
			"(?:"
			+ "b5|#5|5\\+|\\+5|5-|"
			+ "b6|#6|6|"
			+ "b7|#7|7|"
			+ "b9|#9|9\\+|\\+9|9-|"
			+ "#11|11\\+|\\+11|"
			+ "b13|13\\+|\\+13|13-"
			+ "|9|11|13"
			+ ")";

		// Varios ALT_UNIT entre parenteses, separados por / ou , (ex.: (7/9), (9,11))
		var ALT_GROUP = "\\(\\s*" + ALT_UNIT + "(?:\\s*[/,]\\s*" + ALT_UNIT + ")*\\s*\\)";

		// Pode aparecer como grupo (...) ou como item solto (ex.: b9)
		var ALT = "(?:" + ALT_GROUP + "|" + ALT_UNIT + ")*";

		// Baixo /X opcional
		var BASS = "(?:/" + ROOT + ")?";

		// Permite qualquer combinacao de SUF e ALT em qualquer ordem, depois o baixo
		return new RegExp("^(?:N\\.C\\.|" + ROOT + "(?:" + SUF + "|" + ALT + ")*" + BASS + ")$");
	})();

	// remove apenas colchetes externos e pontuacao comum; nao remove parenteses
	function isChordToken(tok) {
		if (!tok) return false;
		var t = String(tok).trim();

		// Normaliza NBSP (caso venha de HTML)
		t = t.replace(/\u00a0/g, " ");

		// Se o token veio embrulhado por [ ], tira so esses colchetes externos
		if (t.charAt(0) === "[" && t.charAt(t.length - 1) === "]") {
			t = t.slice(1, -1).trim();
		} else {
			// remove colchete isolado se sobrar na borda (sem tocar em parenteses)
			t = t.replace(/^\[/, "").replace(/\]$/, "");
		}

		// tira virgulas/pontuacao comuns nas bordas (sem mexer em parenteses)
		t = t.replace(/^[,.;:!?]+/, "").replace(/[,.;:!?]+$/, "");

		return CHORD_TOKEN_RE.test(t);
	}

	// Uma linha e "de acordes" se:
	//  - todos os tokens forem acordes (ex.: "Em7(9)"), OU
	//  - tiver >= 2 acordes E >= 50% dos tokens forem acordes.
	function isChordLine(line) {
		var norm = String(line).replace(/\u00a0/g, " ").trim();
		var tokens = norm.split(/\s+/).filter(Boolean);
		if (!tokens.length) return false;
		var valid = tokens.filter(isChordToken).length;
		if (!valid) return false;
		if (valid === tokens.length) return true; // 100% acordes (mesmo 1 so)
		return valid >= 2 && (valid / tokens.length) >= 0.5;
	}

	function escapeHtml(str) {
		return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
	}

	// ===== Transposicao (recriado de app.html) =====
	var NOTES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

	function n2i(n) { return NOTES.indexOf(n); }
	function i2n(i) { return NOTES[(i + 1200) % 12]; }

	function parseRoot(sym) {
		var m = sym.match(/^([A-G](?:#|b)?)/);
		if (!m) return null;
		return m[1].replace("Bb", "A#").replace("Db", "C#").replace("Eb", "D#").replace("Gb", "F#").replace("Ab", "G#");
	}

	function transposeSymbol(sym, semis) {
		var s = String(sym).trim();
		var parts = s.split("/");
		var head = parts[0];
		var bass = parts[1];

		var root = parseRoot(head);
		if (!root) return s;

		var after = head.slice(root.length);
		var newRoot = i2n(n2i(root) + semis);
		var out = newRoot + after;

		if (bass) {
			var bRoot = parseRoot(bass);
			out += "/" + (bRoot ? i2n(n2i(bRoot) + semis) : bass);
		}
		return out;
	}

	function transporToken(tok, semis) {
		if (!semis) return tok;
		if (tok.charAt(0) === "[" && tok.charAt(tok.length - 1) === "]") {
			return "[" + transposeSymbol(tok.slice(1, -1), semis) + "]";
		}
		return transposeSymbol(tok, semis);
	}

	// ===== Dicionario de acordes (recriado de app.html: normalizeSymbol/chordIntervals/chordNotes) =====
	function normalizeSymbol(symRaw) {
		var s = symRaw.replace(/\s+/g, "");
		s = s.replace(/°|º/g, "dim");
		s = s.replace(/maj7|7M/gi, "maj7");
		s = s.replace(/\+/g, "aug");
		return s;
	}

	function chordIntervals(symbol) {
		var root = parseRoot(symbol);
		if (!root) return { root: null, set: [] };
		var after = symbol.slice(root.length);
		var isDim = /dim/.test(after);
		var isAug = /aug/.test(after);
		var isMin = /^m(?!aj)/.test(after);
		var triad;
		if (isDim) triad = [0, 3, 6];
		else if (isAug) triad = [0, 4, 8];
		else if (isMin) triad = [0, 3, 7];
		else triad = [0, 4, 7];
		if (/sus4/.test(after) || /(^|[^0-9])4(?![0-9])/.test(after)) {
			triad = [0, 5, 7];
		}
		var add = {};
		if (/maj7/.test(after)) add[11] = true;
		else if (/7/.test(after)) add[10] = true;
		if (/(^|[^0-9])6(?![0-9])/.test(after)) add[9] = true;
		if (/\(.*9.*\)|(^|[^0-9])9(?![0-9])/.test(after)) add[2] = true;
		if (/\(.*11.*\)|(^|[^0-9])11(?![0-9])/.test(after)) add[5] = true;
		if (/\(.*13.*\)|(^|[^0-9])13(?![0-9])/.test(after)) add[9] = true;
		var set = {};
		triad.forEach(function (n) { set[n] = true; });
		Object.keys(add).forEach(function (n) { set[n] = true; });
		return { root: root, set: Object.keys(set).map(Number) };
	}

	function chordNotes(sym) {
		var s = normalizeSymbol(sym);
		var partes = s.split("/");
		var head = partes[0];
		var info = chordIntervals(head);
		if (!info.root || !info.set.length) return { root: null, notes: [] };
		var vistos = {};
		var notas = [info.root];
		vistos[info.root] = true;
		info.set.slice().sort(function (a, b) { return a - b; }).forEach(function (semi) {
			var nota = i2n((n2i(info.root) + semi) % 12);
			if (!vistos[nota]) {
				vistos[nota] = true;
				notas.push(nota);
			}
		});
		return { root: info.root, notes: notas };
	}

	function renderCifraLinha(linha, semis) {
		// A linha "TOM:X" nao e uma linha de acordes (CHORD_TOKEN_RE nao bate em "TOM:X" como um
		// todo), mas o tom exibido deve acompanhar a transposicao mesmo assim.
		var tomMatch = linha.match(/^(TOM:)(\S+)(.*)$/i);
		if (tomMatch) {
			var tomExibido = semis ? transposeSymbol(tomMatch[2], semis) : tomMatch[2];
			return escapeHtml(tomMatch[1] + tomExibido + tomMatch[3]);
		}
		if (!isChordLine(linha)) {
			return escapeHtml(linha) || "&nbsp;";
		}
		var partes = linha.split(/(\s+)/);
		return partes.map(function (p) {
			if (!p.trim()) return p;
			if (!isChordToken(p)) return escapeHtml(p);
			return '<span class="chord">' + escapeHtml(transporToken(p, semis)) + "</span>";
		}).join("");
	}

	// ===== Quebra de linhas longas (cifra + letra quebram juntas, na mesma coluna) =====
	function medirLarguraCaractere() {
		var el = document.createElement("span");
		el.style.position = "fixed";
		el.style.visibility = "hidden";
		el.style.whiteSpace = "pre";
		el.style.fontFamily = "\"Courier New\", Consolas, monospace";
		el.style.fontSize = "0.95em";
		el.textContent = new Array(101).join("0");
		document.body.appendChild(el);
		var largura = el.getBoundingClientRect().width / 100;
		document.body.removeChild(el);
		return largura || 8;
	}

	function medirColunasDisponiveis() {
		var container = document.getElementById("lista-musicas");
		var estilos = getComputedStyle(container);
		var larguraDisponivel = container.clientWidth - parseFloat(estilos.paddingLeft) - parseFloat(estilos.paddingRight);
		var larguraChar = medirLarguraCaractere();
		return Math.max(10, Math.floor(larguraDisponivel / larguraChar));
	}

	function ehInicioDePalavra(str, idx) {
		if (idx === 0) return str.charAt(0) !== " ";
		return str.charAt(idx) !== " " && str.charAt(idx - 1) === " ";
	}

	// acha o inicio de palavra mais proximo de "alvo" dentro de str
	function acharInicioDePalavra(str, alvo) {
		var n = str.length;
		if (alvo <= 0) return 0;
		if (alvo >= n) return n;
		for (var passo = 0; passo <= n; passo++) {
			var antes = alvo - passo;
			var depois = alvo + passo;
			if (antes >= 0 && ehInicioDePalavra(str, antes)) return antes;
			if (depois <= n && ehInicioDePalavra(str, depois)) return depois;
		}
		return alvo;
	}

	// quebra um par cifra+letra na mesma posicao, repetindo enquanto alguma das duas nao couber
	function quebrarPar(cifra, letra, colunas) {
		var pares = [];
		var tentativas = 0;
		while ((cifra.length > colunas || letra.length > colunas) && tentativas < 30) {
			tentativas++;
			var referencia = letra.length >= cifra.length ? letra : cifra;
			var alvo = Math.min(colunas, Math.floor(referencia.length / 2));
			var corte = acharInicioDePalavra(referencia, alvo);
			if (corte <= 0 || corte >= referencia.length) {
				corte = Math.max(1, Math.min(colunas, referencia.length - 1));
			}
			pares.push([cifra.slice(0, corte), letra.slice(0, corte)]);
			cifra = cifra.slice(corte);
			letra = letra.slice(corte);
		}
		pares.push([cifra, letra]);
		return pares;
	}

	// quebra uma linha solta (sem par de cifra/letra), repetindo enquanto nao couber
	function quebrarLinhaSolta(linha, colunas) {
		var partes = [];
		var tentativas = 0;
		while (linha.length > colunas && tentativas < 30) {
			tentativas++;
			var alvo = Math.min(colunas, Math.floor(linha.length / 2));
			var corte = acharInicioDePalavra(linha, alvo);
			if (corte <= 0 || corte >= linha.length) {
				corte = Math.max(1, Math.min(colunas, linha.length - 1));
			}
			partes.push(linha.slice(0, corte));
			linha = linha.slice(corte);
		}
		partes.push(linha);
		return partes;
	}

	// Cada item do resultado carrega o indice da linha original (antes da quebra visual) de onde
	// veio - pedacos nascidos da mesma linha original (par quebrado em 2+, ou linha solta quebrada)
	// compartilham o mesmo indiceOriginal. Isso e o que permite ao sincronismo com o NodeMCU (ver
	// spec_esp32.md secao 4.4) saber "qual linha do .txt original" esta em exibicao, independente
	// de quebra visual.
	function quebrarLinhasLongas(linhas, colunas) {
		var resultado = [];
		var i = 0;
		while (i < linhas.length) {
			var atual = linhas[i];
			var proxima = linhas[i + 1];
			if (isChordLine(atual) && proxima !== undefined) {
				quebrarPar(atual, proxima, colunas).forEach(function (par) {
					resultado.push({ texto: par[0], indiceOriginal: i });
					resultado.push({ texto: par[1], indiceOriginal: i + 1 });
				});
				i += 2;
			} else if (atual.length > colunas) {
				quebrarLinhaSolta(atual, colunas).forEach(function (l) {
					resultado.push({ texto: l, indiceOriginal: i });
				});
				i += 1;
			} else {
				resultado.push({ texto: atual, indiceOriginal: i });
				i += 1;
			}
		}
		return resultado;
	}

	var colunasDisponiveis = medirColunasDisponiveis();

	// <intro>/</intro> ficam em linhas proprias. As linhas ENTRE os marcadores (exclusive) sao
	// marcadas como "dentro da intro" (cor diferenciada); os marcadores em si nunca aparecem.
	function marcarLinhasIntro(linhas) {
		var flags = [];
		var dentro = false;
		linhas.forEach(function (l, i) {
			var t = l.trim();
			if (t === "<intro>") {
				dentro = true;
				flags[i] = false;
			} else if (t === "</intro>") {
				dentro = false;
				flags[i] = false;
			} else {
				flags[i] = dentro;
			}
		});
		return flags;
	}

	function ehMarcadorIntro(texto) {
		var t = texto.trim();
		return t === "<intro>" || t === "</intro>";
	}

	function renderCifra(texto, semis) {
		var linhas = String(texto).replace(/\r\n?/g, "\n").split("\n");
		var flagsIntro = marcarLinhasIntro(linhas);
		var partes = quebrarLinhasLongas(linhas, colunasDisponiveis);
		return partes.map(function (parte) {
			var marcador = ehMarcadorIntro(parte.texto);
			var html = marcador ? "" : renderCifraLinha(parte.texto, semis);
			var classe = "linha" + (flagsIntro[parte.indiceOriginal] ? " intro" : "");
			return '<span class="' + classe + '" data-linha-original="' + parte.indiceOriginal + '">' + html + "</span>";
		}).join("\n");
	}

	// ===== Persistencia no cache do navegador =====
	var CHAVE_TRANSPOSTOS = "cifras_transpostos_v1";
	var CHAVE_VELOCIDADES = "cifras_velocidades_v1";
	var VELOCIDADE_PADRAO = 0;

	function carregarTranspostos() {
		try {
			return JSON.parse(localStorage.getItem(CHAVE_TRANSPOSTOS)) || {};
		} catch (e) {
			return {};
		}
	}

	function salvarTranspostos(mapa) {
		try {
			localStorage.setItem(CHAVE_TRANSPOSTOS, JSON.stringify(mapa));
		} catch (e) {}
	}

	function carregarVelocidades() {
		try {
			return JSON.parse(localStorage.getItem(CHAVE_VELOCIDADES)) || {};
		} catch (e) {
			return {};
		}
	}

	function salvarVelocidades(mapa) {
		try {
			localStorage.setItem(CHAVE_VELOCIDADES, JSON.stringify(mapa));
		} catch (e) {}
	}

	var CHAVE_SELECIONADAS = "cifras_selecionadas_v1";

	function carregarSelecionadas() {
		try {
			return JSON.parse(localStorage.getItem(CHAVE_SELECIONADAS)) || [];
		} catch (e) {
			return [];
		}
	}

	function salvarSelecionadas(lista) {
		try {
			localStorage.setItem(CHAVE_SELECIONADAS, JSON.stringify(lista));
		} catch (e) {}

	// ===== Grupos (subpastas de \cifras - ver rc.md secao GRUPOS) =====
	var CHAVE_GRUPO_ATIVO = "cifras_grupo_ativo_v1";

	function carregarGrupoAtivo() {
		try {
			return localStorage.getItem(CHAVE_GRUPO_ATIVO) || "";
		} catch (e) {
			return "";
		}
	}

	function salvarGrupoAtivo(grupo) {
		try {
			localStorage.setItem(CHAVE_GRUPO_ATIVO, grupo || "");
		} catch (e) {}
	}

	// ===== Selecao compartilhada via URL (#sel=indice-velocidade,indice-velocidade,...) =====
	// Vai na HASH (nao na query string) de proposito: este arquivo costuma ser aberto via
	// htmlpreview.github.io, que usa TODA a query string como a propria URL de destino
	// (?https://github.com/...) - mexer nela com URLSearchParams quebra esse redirecionamento.
	// A hash nunca e tocada por esse tipo de proxy, entao e o unico lugar seguro pra isso.
	// O indice usado e a posicao de "musica" no array ja ordenado (musicas[indice]) - so funciona
	// se remetente e destinatario estiverem vendo a mesma versao de telaCel.html (mesmo conjunto
	// de musicas), que e o caso normal aqui (o link aponta pro mesmo arquivo publicado).
	function analisarUrlCompartilhada() {
		try {
			var hash = window.location.hash || "";
			if (hash.charAt(0) === "#") hash = hash.slice(1);
			if (hash.indexOf("sel=") !== 0) return null;
			var payload = hash.slice(4);
			if (!payload) return null;
			var itens = payload.split(",").map(function (par) {
				var partes = par.split("-");
				return { idx: parseInt(partes[0], 10), v: parseInt(partes[1], 10) };
			}).filter(function (item) {
				return !isNaN(item.idx) && !isNaN(item.v);
			});
			return itens.length ? itens : null;
		} catch (e) {
			return null;
		}
	}

	var itensCompartilhados = analisarUrlCompartilhada();

	var xmlText = document.getElementById("musicas-xml").textContent;
	var xml = new DOMParser().parseFromString(xmlText, "application/xml");
	var nos = Array.prototype.slice.call(xml.getElementsByTagName("musica"));
	var transpostosSalvos = carregarTranspostos();
	var velocidadesSalvas = carregarVelocidades();

	var musicas = nos.map(function (no) {
		var conteudo = (no.textContent || "").trim();
		var linhas = conteudo.split(/\r?\n/);
		var titulo = (linhas[0] || "(Sem titulo)").trim();
		var corpo = linhas.slice(1).join("\n").trim();
		var semisSalvo = transpostosSalvos[titulo] || 0;
		var velocidadeSalva = velocidadesSalvas[titulo];
		if (velocidadeSalva === undefined) velocidadeSalva = VELOCIDADE_PADRAO;
		var grupo = no.getAttribute("grupo") || "";
		return { titulo: titulo, conteudo: corpo, semis: semisSalvo, velocidade: velocidadeSalva, grupo: grupo };
	});

	musicas.sort(function (a, b) {
		return normalizar(a.titulo).localeCompare(normalizar(b.titulo));
	});

	// grupoAtivo precisa existir ANTES do primeiro aplicarFiltro() possivel (mais abaixo, no bloco
	// de selecao compartilhada via URL) - se ficasse "undefined" (var so declarada, sem valor, mais
	// pra frente no arquivo) o filtro ficaria incorreto nessa primeira chamada.
	var gruposDisponiveis = [];
	musicas.forEach(function (m) {
		if (m.grupo && gruposDisponiveis.indexOf(m.grupo) === -1) gruposDisponiveis.push(m.grupo);
	});
	gruposDisponiveis.sort(function (a, b) {
		return normalizar(a).localeCompare(normalizar(b));
	});

	var grupoAtivo = carregarGrupoAtivo();
	// se o grupo salvo nao existe mais (cifras reorganizadas desde a ultima visita), volta ao padrao
	if (grupoAtivo && gruposDisponiveis.indexOf(grupoAtivo) === -1) grupoAtivo = "";

	// So agora "musicas" existe e esta na ordem final, entao os indices da URL podem ser resolvidos.
	var selecaoCompartilhadaResolvida = null;
	if (itensCompartilhados) {
		var mapaVelCompartilhada = carregarVelocidades();
		selecaoCompartilhadaResolvida = [];
		itensCompartilhados.forEach(function (item) {
			var musica = musicas[item.idx];
			if (!musica) return;
			var v = Math.max(0, Math.min(100, item.v));
			musica.velocidade = v;
			mapaVelCompartilhada[musica.titulo] = v;
			selecaoCompartilhadaResolvida.push(musica.titulo);
		});
		salvarVelocidades(mapaVelCompartilhada);
	}

	var lista = document.getElementById("lista-musicas");
	lista.innerHTML = ""; // idempotente: limpa antes de popular, mesmo se a fonte ja vier com algo aqui
	var primeiraPorLetra = {};
	var ordemSelecao = carregarSelecionadas();

	if (selecaoCompartilhadaResolvida && selecaoCompartilhadaResolvida.length) {
		ordemSelecao = selecaoCompartilhadaResolvida;
		salvarSelecionadas(ordemSelecao);
	}

	musicas.forEach(function (musica, i) {
		var id = "musica-" + i;
		var letraMatch = normalizar(musica.titulo).match(/[A-Z]/);
		var letra = letraMatch ? letraMatch[0] : "#";
		if (!(letra in primeiraPorLetra)) {
			primeiraPorLetra[letra] = id;
		}

		var secao = document.createElement("section");
		secao.className = "musica";
		secao.id = id;
		secao.style.order = i;
		secao.dataset.grupo = musica.grupo;
		if (ordemSelecao.indexOf(musica.titulo) !== -1) {
			secao.classList.add("selecionada");
		}

		var h2 = document.createElement("h2");
		h2.textContent = musica.titulo;
		h2.addEventListener("click", function () {
			alternarSelecao(secao, musica);
		});
		secao.appendChild(h2);

		var controleVel = document.createElement("div");
		controleVel.className = "velocidade-controle";

		var valorVel = document.createElement("span");
		valorVel.className = "velocidade-valor";
		valorVel.textContent = musica.velocidade + "%";

		var sliderVel = document.createElement("input");
		sliderVel.type = "range";
		sliderVel.min = "0";
		sliderVel.max = "100";
		sliderVel.step = "5";
		sliderVel.value = String(musica.velocidade);
		sliderVel.addEventListener("input", function () {
			musica.velocidade = parseInt(sliderVel.value, 10);
			valorVel.textContent = musica.velocidade + "%";
			var mapa = carregarVelocidades();
			mapa[musica.titulo] = musica.velocidade;
			salvarVelocidades(mapa);
		});

		controleVel.appendChild(sliderVel);
		controleVel.appendChild(valorVel);
		secao.appendChild(controleVel);

		var pre = document.createElement("pre");
		pre.className = "cifra";
		pre.innerHTML = renderCifra(musica.conteudo, musica.semis);
		secao.appendChild(pre);

		lista.appendChild(secao);
	});

	// ===== Selecao e filtro de musicas =====
	var filtroAtivo = false;
	var filtroBtn = document.getElementById("filtro-btn");
	var limparSelecaoBtn = document.getElementById("limpar-selecao-btn");
	var compartilharBtn = document.getElementById("compartilhar-btn");

	function atualizarControlesSelecao() {
		var temSelecao = ordemSelecao.length > 0;
		filtroBtn.hidden = !temSelecao;
		limparSelecaoBtn.hidden = !temSelecao;
		compartilharBtn.hidden = !temSelecao;
	}

	// grupoAtivo e definido mais abaixo (secao GRUPOS), depois que a lista de grupos disponiveis
	// e calculada - aplicarFiltro so e chamada de verdade depois disso.
	function aplicarFiltro() {
		document.querySelectorAll(".musica").forEach(function (secao, i) {
			// grupo "" = sem grupo (arquivos direto na raiz de \cifras). So mostra a musica se ela
			// estiver no grupo ativo (ou sem grupo, quando nenhum grupo esta selecionado).
			var noGrupoAtivo = grupoAtivo ? secao.dataset.grupo === grupoAtivo : secao.dataset.grupo === "";
			if (!noGrupoAtivo) {
				secao.hidden = true;
				return;
			}
			var titulo = secao.querySelector("h2").textContent;
			if (filtroAtivo) {
				var pos = ordemSelecao.indexOf(titulo);
				secao.hidden = pos === -1;
				if (pos !== -1) secao.style.order = pos;
			} else {
				secao.hidden = false;
				secao.style.order = i;
			}
		});
	}

	function alternarSelecao(secao, musica) {
		var pos = ordemSelecao.indexOf(musica.titulo);
		if (pos === -1) {
			ordemSelecao.push(musica.titulo);
			secao.classList.add("selecionada");
		} else {
			ordemSelecao.splice(pos, 1);
			secao.classList.remove("selecionada");
		}
		salvarSelecionadas(ordemSelecao);
		atualizarControlesSelecao();
		if (filtroAtivo) aplicarFiltro();
	}

	filtroBtn.addEventListener("click", function () {
		filtroAtivo = true;
		aplicarFiltro();
	});

	limparSelecaoBtn.addEventListener("click", function () {
		ordemSelecao = [];
		salvarSelecionadas(ordemSelecao);
		document.querySelectorAll(".musica.selecionada").forEach(function (secao) {
			secao.classList.remove("selecionada");
		});
		filtroAtivo = false;
		aplicarFiltro();
		atualizarControlesSelecao();
	});

	function construirUrlCompartilhamento() {
		var pares = [];
		ordemSelecao.forEach(function (titulo) {
			var idx = musicas.findIndex(function (m) { return m.titulo === titulo; });
			if (idx === -1) return;
			pares.push(idx + "-" + musicas[idx].velocidade);
		});
		// so mexe na hash; a query string (usada pelo htmlpreview.github.io pra apontar pro
		// arquivo real no GitHub) fica intocada.
		return window.location.origin + window.location.pathname + window.location.search + "#sel=" + pares.join(",");
	}

	compartilharBtn.addEventListener("click", function () {
		var url = construirUrlCompartilhamento();
		if (navigator.share) {
			navigator.share({ url: url, title: "Cifras" }).catch(function () {});
			return;
		}
		if (navigator.clipboard && navigator.clipboard.writeText) {
			navigator.clipboard.writeText(url).then(function () {
				var icone = compartilharBtn.querySelector("i");
				var classeOriginal = icone.className;
				icone.className = "bi bi-check2";
				compartilharBtn.classList.add("copiado");
				setTimeout(function () {
					icone.className = classeOriginal;
					compartilharBtn.classList.remove("copiado");
				}, 1500);
			}).catch(function () {});
		}
	});

	// Se a pagina foi aberta a partir de um link compartilhado, ja abre filtrada nas musicas
	// recebidas (a selecao e as velocidades ja foram aplicadas mais acima). Limpa o parametro da
	// URL depois de aplicar pra nao forcar esse estado de novo num reload manual futuro.
	if (selecaoCompartilhadaResolvida && selecaoCompartilhadaResolvida.length) {
		filtroAtivo = true;
		aplicarFiltro();
		// remove so a hash (#sel=...), preserva a query string intacta (importante no htmlpreview)
		window.history.replaceState(null, "", window.location.pathname + window.location.search);
	}

	atualizarControlesSelecao();

	// ===== Download do arquivo HTML completo =====
	document.getElementById("download-btn").addEventListener("click", function () {
		// htmlOriginal foi capturado antes da limpeza/preenchimento de nav-alfabeto e
		// lista-musicas rodar - se a fonte ja veio corrompida (duplicada), ele ainda carrega essa
		// duplicacao. Por garantia, forca esses dois containers vazios numa copia isolada (parseada
		// a parte, sem afetar a pagina ao vivo) antes de gerar o arquivo.
		var docLimpo = new DOMParser().parseFromString(htmlOriginal, "text/html");
		var navLimpo = docLimpo.getElementById("nav-alfabeto");
		if (navLimpo) navLimpo.innerHTML = "";
		var listaLimpa = docLimpo.getElementById("lista-musicas");
		if (listaLimpa) listaLimpa.innerHTML = "";
		var html = "<!DOCTYPE html>\n" + docLimpo.documentElement.outerHTML;
		var blob = new Blob([html], { type: "text/html" });
		var url = URL.createObjectURL(blob);
		var a = document.createElement("a");
		a.href = url;
		a.download = "telaCel.html";
		document.body.appendChild(a);
		a.click();
		document.body.removeChild(a);
		setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
	});

	// Descobre qual musica esta sendo lida no momento (a que fica logo abaixo do cabecalho fixo)
	// Encontra a secao .musica que esta na altura Y informada (ultima cujo topo ja passou de Y)
	function musicaNaAltura(y) {
		// So considera secoes visiveis (o filtro esconde as demais com [hidden], cujo rect fica zerado)
		// e ordena pela posicao visual real, pois o CSS "order" pode divergir da ordem do DOM quando filtrado.
		var secoes = Array.prototype.filter.call(document.querySelectorAll(".musica"), function (s) {
			return !s.hidden;
		});
		secoes.sort(function (a, b) {
			return a.getBoundingClientRect().top - b.getBoundingClientRect().top;
		});
		var atual = secoes[0] || null;
		for (var i = 0; i < secoes.length; i++) {
			if (secoes[i].getBoundingClientRect().top <= y + 1) {
				atual = secoes[i];
			} else {
				break;
			}
		}
		return atual;
	}

	function musicaAtual() {
		return musicaNaAltura(0);
	}

	function transporAtual(delta) {
		var secao = musicaAtual();
		if (!secao) return;
		var idx = parseInt(secao.id.replace("musica-", ""), 10);
		var musica = musicas[idx];
		if (!musica) return;
		musica.semis += delta;
		var pre = secao.querySelector("pre.cifra");
		pre.innerHTML = renderCifra(musica.conteudo, musica.semis);

		var mapa = carregarTranspostos();
		if (musica.semis) {
			mapa[musica.titulo] = musica.semis;
		} else {
			delete mapa[musica.titulo];
		}
		salvarTranspostos(mapa);
	}

	// ===== Rolagem automatica (play/pause) =====
	var tocando = false;
	var scrollRAF = null;
	var ultimoTimestamp = null;
	var fracaoAcumulada = 0; // guarda pixels fracionarios entre frames (scrollBy arredonda para inteiro)
	var botaoPlayPause = document.getElementById("play-pause-btn");
	var iconePlayPause = botaoPlayPause.querySelector("i");

	function velocidadeAtualPct() {
		var secao = musicaAtual();
		if (!secao) return VELOCIDADE_PADRAO;
		var idx = parseInt(secao.id.replace("musica-", ""), 10);
		var musica = musicas[idx];
		var v = musica ? Number(musica.velocidade) : NaN;
		return isNaN(v) ? VELOCIDADE_PADRAO : v;
	}

	// 0% = parado, cada 1% = 0.5px/s (2% = 1px/s), 100% = 50px/s
	function pxPorSegundo(pct) {
		return pct * 0.5;
	}

	// ===== Espera de 5s na troca de musica (so com selecao+filtro+play ativos) =====
	// esperandoTransicaoAte: timestamp (mesmo relogio de performance.now()/rAF) ate quando a
	// rolagem deve ficar parada; 0 = nao estamos esperando.
	var esperandoTransicaoAte = 0;
	var musicaAnteriorParaTransicao = null;

	function estaEmEsperaDeTransicao() {
		return esperandoTransicaoAte > 0 && performance.now() < esperandoTransicaoAte;
	}

	function verificarTransicaoDeMusica() {
		if (!filtroAtivo || !tocando) {
			musicaAnteriorParaTransicao = null;
			return;
		}
		var secao = musicaAtual();
		if (!secao) return;
		var titulo = secao.querySelector("h2").textContent;
		if (musicaAnteriorParaTransicao === null) {
			musicaAnteriorParaTransicao = titulo;
			return;
		}
		if (titulo !== musicaAnteriorParaTransicao) {
			musicaAnteriorParaTransicao = titulo;
			esperandoTransicaoAte = performance.now() + 5000;
			atualizarControlesVelocidadeVisibilidade();
			agendarEnvioEstado();
		}
	}

	function passoScroll(timestamp) {
		if (!tocando) {
			scrollRAF = null;
			ultimoTimestamp = null;
			fracaoAcumulada = 0;
			return;
		}
		if (ultimoTimestamp === null) ultimoTimestamp = timestamp;
		var dt = (timestamp - ultimoTimestamp) / 1000;
		ultimoTimestamp = timestamp;

		if (estaEmEsperaDeTransicao()) {
			scrollRAF = requestAnimationFrame(passoScroll);
			return;
		}
		if (esperandoTransicaoAte) {
			esperandoTransicaoAte = 0;
			atualizarControlesVelocidadeVisibilidade();
			agendarEnvioEstado();
		}

		fracaoAcumulada += pxPorSegundo(velocidadeAtualPct()) * dt;
		var pixelsInteiros = Math.floor(fracaoAcumulada);
		if (pixelsInteiros > 0) {
			window.scrollBy(0, pixelsInteiros);
			fracaoAcumulada -= pixelsInteiros;
		}
		if ((window.innerHeight + window.scrollY) >= document.documentElement.scrollHeight - 2) {
			pararScroll();
			return;
		}
		scrollRAF = requestAnimationFrame(passoScroll);
	}

	// ===== Mantem a tela ligada enquanto a rolagem estiver ativa =====
	var wakeLock = null;
	var wakeLockRetryInterval = null;
	var elWakeLockIndicativo = document.getElementById("wakelock-indicativo");

	// So pra diagnostico (ver simplificado/spec_esp32.md): mostra se a tela esta mesmo sendo
	// mantida acesa. "falhou" cobre tanto API ausente quanto request() recusado - nesses casos a
	// tela do celular PODE apagar sozinha durante o play, o que e uma limitacao do navegador/SO,
	// nao algo que o app consiga forcar.
	function atualizarIndicativoWakeLock() {
		if (!tocando) {
			elWakeLockIndicativo.hidden = true;
			return;
		}
		elWakeLockIndicativo.hidden = false;
		elWakeLockIndicativo.classList.toggle("ativo", !!wakeLock);
		elWakeLockIndicativo.classList.toggle("falhou", !wakeLock);
	}

	function pedirWakeLock() {
		if (!("wakeLock" in navigator)) {
			atualizarIndicativoWakeLock();
			return;
		}
		navigator.wakeLock.request("screen").then(function (lock) {
			wakeLock = lock;
			wakeLock.addEventListener("release", function () {
				wakeLock = null;
				atualizarIndicativoWakeLock();
			});
			atualizarIndicativoWakeLock();
		}).catch(function () {
			wakeLock = null;
			atualizarIndicativoWakeLock();
		});
	}

	function liberarWakeLock() {
		if (wakeLock) {
			wakeLock.release().catch(function () {});
			wakeLock = null;
		}
	}

	document.addEventListener("visibilitychange", function () {
		if (tocando && document.visibilityState === "visible") {
			if (!wakeLock) pedirWakeLock();
			// A aba pode ter ficado em segundo plano tempo suficiente pra timers ficarem suspensos
			// (mesmo o listener de scroll nao dispara nesse periodo) - ao voltar, reenvia a posicao
			// atual imediatamente em vez de esperar o proximo scroll do usuario.
			agendarEnvioEstado();
		}
	});

	function iniciarScroll() {
		tocando = true;
		iconePlayPause.className = "bi bi-pause";
		atualizarIndicativoWakeLock();
		pedirWakeLock();
		if (!wakeLockRetryInterval) {
			// O wake lock pode falhar em silencio (ex.: navegador recusa) ou ser liberado pelo
			// sistema sem disparar visibilitychange (alguns Android fazem isso quando a tela apaga
			// por timeout antes do usuario notar) - insiste periodicamente enquanto estiver tocando,
			// em vez de depender so da re-tentativa no evento de visibilidade.
			// IMPORTANTE: navigator.wakeLock.request() so funciona com a pagina VISIVEL (lanca
			// NotAllowedError e falha em silencio caso contrario) - so tenta nesse caso, senao a
			// tela ja apagou e nao ha nada que a pagina consiga fazer ate o usuario acorda-la de novo.
			wakeLockRetryInterval = setInterval(function () {
				if (tocando && !wakeLock && document.visibilityState === "visible") pedirWakeLock();
			}, 10000);
		}
		atualizarControlesVelocidadeVisibilidade();
		agendarEnvioEstado();
		if (!scrollRAF) {
			ultimoTimestamp = null;
			scrollRAF = requestAnimationFrame(passoScroll);
		}
	}

	function pararScroll() {
		tocando = false;
		iconePlayPause.className = "bi bi-play";
		liberarWakeLock();
		atualizarIndicativoWakeLock();
		if (wakeLockRetryInterval) {
			clearInterval(wakeLockRetryInterval);
			wakeLockRetryInterval = null;
		}
		esperandoTransicaoAte = 0;
		musicaAnteriorParaTransicao = null;
		atualizarControlesVelocidadeVisibilidade();
		agendarEnvioEstado();
		if (scrollRAF) cancelAnimationFrame(scrollRAF);
		scrollRAF = null;
		ultimoTimestamp = null;
	}

	botaoPlayPause.addEventListener("click", function () {
		if (tocando) {
			pararScroll();
		} else {
			iniciarScroll();
		}
	});

	document.getElementById("transpor-mais-btn").addEventListener("click", function () {
		transporAtual(1);
	});
	document.getElementById("transpor-menos-btn").addEventListener("click", function () {
		transporAtual(-1);
	});

	// ===== Botoes de ajuste fino de velocidade (so aparecem tocando, e nao durante a espera de
	// transicao) - afetam somente a musica atualmente sob o botao de play (a que esta rolando) =====
	var velocidadeMenosBtn = document.getElementById("velocidade-menos-btn");
	var velocidadeMaisBtn = document.getElementById("velocidade-mais-btn");

	function atualizarControlesVelocidadeVisibilidade() {
		var visivel = tocando && !estaEmEsperaDeTransicao();
		velocidadeMenosBtn.hidden = !visivel;
		velocidadeMaisBtn.hidden = !visivel;
	}

	// delta em px/segundo; a conversao pra % usa a mesma relacao de pxPorSegundo (1% = 0.5px/s)
	function ajustarVelocidadeMusicaAtual(deltaPxPorSeg) {
		var secao = musicaAtual();
		if (!secao) return;
		var idx = parseInt(secao.id.replace("musica-", ""), 10);
		var musica = musicas[idx];
		if (!musica) return;

		var deltaPct = deltaPxPorSeg / 0.5;
		var novoValor = Math.max(0, Math.min(100, musica.velocidade + deltaPct));
		if (novoValor === musica.velocidade) return;
		musica.velocidade = novoValor;

		var slider = secao.querySelector(".velocidade-controle input[type='range']");
		var valorSpan = secao.querySelector(".velocidade-valor");
		if (slider) slider.value = String(novoValor);
		if (valorSpan) valorSpan.textContent = novoValor + "%";

		var mapa = carregarVelocidades();
		mapa[musica.titulo] = novoValor;
		salvarVelocidades(mapa);
	}

	velocidadeMenosBtn.addEventListener("click", function () {
		ajustarVelocidadeMusicaAtual(-1);
	});
	velocidadeMaisBtn.addEventListener("click", function () {
		ajustarVelocidadeMusicaAtual(1);
	});

	var nav = document.getElementById("nav-alfabeto");
	nav.innerHTML = ""; // idempotente: limpa antes de popular, mesmo se a fonte ja vier com algo aqui
	var letraParaLink = {};

	"ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(function (letra) {
		var link = document.createElement("a");
		link.textContent = letra;
		link.href = "#";
		link.className = primeiraPorLetra[letra] ? "ativo" : "inativo";
		// Sempre registra o clique (mesmo comecando inativo): quando um grupo e trocado, a classe
		// e reavaliada (atualizarNavAlfabeto) e primeiraPorLetra[letra] e lido de novo aqui em cima
		// no momento do clique - nao precisa recriar o link nem o listener a cada troca de grupo.
		link.addEventListener("click", function (e) {
			e.preventDefault();
			if (!primeiraPorLetra[letra]) return;
			document.getElementById(primeiraPorLetra[letra]).scrollIntoView({ behavior: "smooth", block: "start" });
		});
		letraParaLink[letra] = link;
		nav.appendChild(link);
	});

	// Recalcula primeiraPorLetra considerando so as secoes VISIVEIS no momento (grupo ativo) e
	// atualiza a classe ativo/inativo de cada letra de acordo.
	function atualizarNavAlfabeto() {
		var mapa = {};
		document.querySelectorAll(".musica").forEach(function (secao) {
			if (secao.hidden) return;
			var letraMatch = normalizar(secao.querySelector("h2").textContent).match(/[A-Z]/);
			var letra = letraMatch ? letraMatch[0] : "#";
			if (!(letra in mapa)) mapa[letra] = secao.id;
		});
		primeiraPorLetra = mapa;
		Object.keys(letraParaLink).forEach(function (letra) {
			letraParaLink[letra].className = mapa[letra] ? "ativo" : "inativo";
		});
	}

	// ===== Grupos (subpastas de \cifras): painel de botoes + icone de alternancia em nav-alfabeto =====
	// (gruposDisponiveis/grupoAtivo em si ja foram calculados mais acima, antes do primeiro
	// aplicarFiltro() possivel - ver comentario proximo a essas variaveis.)
	if (gruposDisponiveis.length) {
		var gruposPainel = document.getElementById("grupos-painel");
		var botaoParaGrupo = {};

		gruposDisponiveis.forEach(function (nomeGrupo) {
			var botao = document.createElement("div");
			botao.className = "botao-circular botao-grupo" + (nomeGrupo === grupoAtivo ? " ativo" : "");
			botao.textContent = nomeGrupo;
			botao.addEventListener("click", function () {
				grupoAtivo = (grupoAtivo === nomeGrupo) ? "" : nomeGrupo;
				salvarGrupoAtivo(grupoAtivo);
				Object.keys(botaoParaGrupo).forEach(function (g) {
					botaoParaGrupo[g].classList.toggle("ativo", g === grupoAtivo);
				});
				aplicarFiltro();
				atualizarNavAlfabeto();
				gruposPainel.classList.remove("visivel");
			});
			botaoParaGrupo[nomeGrupo] = botao;
			gruposPainel.appendChild(botao);
		});

		// icone de alternancia do painel de grupos - ultimo item de #nav-alfabeto, mesmo tamanho
		// de fonte dos demais (herda de "#nav-alfabeto a").
		var grupoToggle = document.createElement("a");
		grupoToggle.href = "#";
		grupoToggle.className = "grupo-toggle";
		grupoToggle.innerHTML = '<i class="bi bi-node-plus-fill"></i>';
		grupoToggle.addEventListener("click", function (e) {
			e.preventDefault();
			gruposPainel.classList.toggle("visivel");
		});
		nav.appendChild(grupoToggle);
	}

	// Aplica o grupo ativo (persistido ou padrao "sem grupo") logo na carga da pagina.
	aplicarFiltro();
	atualizarNavAlfabeto();

	// ===== Destaca no menu lateral a inicial da musica que esta na tela =====
	var letraDestacada = null;

	function atualizarLetraAtual() {
		var secao = musicaAtual();
		if (!secao) return;
		var idx = parseInt(secao.id.replace("musica-", ""), 10);
		var musica = musicas[idx];
		if (!musica) return;
		var letraMatch = normalizar(musica.titulo).match(/[A-Z]/);
		var letra = letraMatch ? letraMatch[0] : "#";
		if (letra === letraDestacada) return;
		if (letraDestacada && letraParaLink[letraDestacada]) {
			letraParaLink[letraDestacada].classList.remove("atual");
		}
		if (letraParaLink[letra]) {
			letraParaLink[letra].classList.add("atual");
		}
		letraDestacada = letra;
	}

	var atualizacaoLetraAgendada = false;
	window.addEventListener("scroll", function () {
		if (atualizacaoLetraAgendada) return;
		atualizacaoLetraAgendada = true;
		requestAnimationFrame(function () {
			atualizacaoLetraAgendada = false;
			atualizarLetraAtual();
		});
	});
	atualizarLetraAtual();

	// ===== Sincronizacao com a tela da igreja via NodeMCU/ESP8266 (ver simplificado/spec_esp32.md) =====
	// IP do NodeMCU no modo SoftAP; usado so quando esta pagina foi aberta como arquivo local
	// (editar aqui se o modo AP do firmware mudar no futuro).
	var SERVIDOR_IP = "192.168.4.1";

	// Quando o proprio NodeMCU serve este telaCel.html (http://192.168.4.1/), usa caminho relativo
	// (mesma origem) - funciona mesmo que o IP/porta do AP mude, e evita CORS. So cai pro IP fixo
	// quando a pagina foi aberta localmente (file://), onde nao ha "mesma origem" pra falar com o
	// NodeMCU.
	function urlEstado() {
		if (window.location.protocol !== "file:") {
			return "/estado";
		}
		return "http://" + SERVIDOR_IP + "/estado";
	}

	// Acha, dentro do <pre class="cifra"> informado, o span .linha cuja borda superior esta na
	// altura Y (mesmo algoritmo geometrico de musicaNaAltura, aplicado as linhas em vez de as secoes).
	function linhaNaAltura(pre, y) {
		var spans = Array.prototype.slice.call(pre.querySelectorAll(".linha"));
		if (!spans.length) return null;
		spans.sort(function (a, b) {
			return a.getBoundingClientRect().top - b.getBoundingClientRect().top;
		});
		var atual = spans[0];
		for (var i = 0; i < spans.length; i++) {
			if (spans[i].getBoundingClientRect().top <= y + 1) {
				atual = spans[i];
			} else {
				break;
			}
		}
		return atual;
	}

	// Musica + indice de linha original que devem ser mandados pro NodeMCU neste momento (ou null
	// se nao houver musica/linha detectavel, ex.: lista vazia).
	function estadoAtualDeLeitura() {
		var secao = musicaAtual();
		if (!secao) return null;
		var idx = parseInt(secao.id.replace("musica-", ""), 10);
		var musica = musicas[idx];
		if (!musica) return null;
		var pre = secao.querySelector("pre.cifra");
		var span = pre ? linhaNaAltura(pre, 0) : null;
		if (!span) return null;
		var linha = parseInt(span.getAttribute("data-linha-original"), 10);
		if (isNaN(linha)) return null;
		var aguardando = !tocando || estaEmEsperaDeTransicao();
		return { titulo: musica.titulo, linha: linha, aguardando: aguardando };
	}

	// Envio best-effort/nao-bloqueante: se o NodeMCU estiver fora do ar, falha em silencio e a tela
	// do celular continua funcionando normalmente (ver criterio de aceite em spec_esp32.md).
	var ultimoEstadoEnviadoChave = null;

	function enviarEstado(estado) {
		var chave = estado.titulo + " " + estado.linha + " " + estado.aguardando;
		if (chave === ultimoEstadoEnviadoChave) return;
		ultimoEstadoEnviadoChave = chave;

		var controller = ("AbortController" in window) ? new AbortController() : null;
		var timeoutId = controller ? setTimeout(function () { controller.abort(); }, 1500) : null;

		fetch(urlEstado(), {
			method: "POST",
			headers: { "Content-Type": "application/json" },
			body: JSON.stringify(estado),
			signal: controller ? controller.signal : undefined
		}).catch(function () {
			// sem NodeMCU por perto, ou rede fora do ar: ignora silenciosamente
		}).then(function () {
			if (timeoutId) clearTimeout(timeoutId);
		});
	}

	// Throttle: no maximo 1 tentativa de envio a cada ~300ms (enviarEstado ainda filtra por valor
	// inalterado por cima disso).
	var envioEstadoAgendado = null;

	function agendarEnvioEstado() {
		if (envioEstadoAgendado) return;
		envioEstadoAgendado = setTimeout(function () {
			envioEstadoAgendado = null;
			var estado = estadoAtualDeLeitura();
			if (estado) enviarEstado(estado);
		}, 300);
	}

	// Sempre ativo (nao so durante o play automatico) - o usuario pode rolar manualmente com o
	// dedo e a tela da igreja deve acompanhar do mesmo jeito. verificarTransicaoDeMusica roda
	// sincrono (sem throttle) pra garantir que esperandoTransicaoAte ja esteja setado antes do
	// agendarEnvioEstado (que so dispara ~300ms depois) mandar o "aguardando" certo pro NodeMCU.
	window.addEventListener("scroll", verificarTransicaoDeMusica);
	window.addEventListener("scroll", agendarEnvioEstado);
	agendarEnvioEstado();

	// ===== Modal com as notas do acorde clicado =====
	var modalAcorde = document.getElementById("acorde-modal");
	var modalAcordeSimbolo = modalAcorde.querySelector(".simbolo");
	var modalAcordeNotas = modalAcorde.querySelector(".notas");

	function mostrarModalAcorde(simbolo) {
		var info = chordNotes(simbolo);
		if (!info.root) return;
		modalAcordeSimbolo.textContent = simbolo;
		modalAcordeNotas.textContent = info.notes.join("  -  ");
		modalAcorde.classList.add("aberto");
	}

	function esconderModalAcorde() {
		modalAcorde.classList.remove("aberto");
	}

	modalAcorde.addEventListener("click", esconderModalAcorde);

	lista.addEventListener("click", function (e) {
		var span = e.target.closest(".chord");
		if (!span) return;
		mostrarModalAcorde(span.textContent);
	});
})();
</script>
</body>
</html>
